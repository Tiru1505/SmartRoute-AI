# Named Hyderabad landmarks used as routing endpoints.
#
# Shared between the Python engine and the React frontend so both refer to the
# same coordinates. If you add a place here, add it to
# frontend/src/data/mockData.js LOCATIONS as well.
#
# Coordinates are [latitude, longitude] and all fall inside the metro graph.

places:
